name: packagers

# Builds a HiGHS ref with the recipes that vcpkg, conda-forge, Homebrew and
# nixpkgs use for their next release, and runs the packager's own tests. Each
# recipe is fetched from its upstream repo; only the source is swapped for the
# HiGHS ref.
on:
  workflow_dispatch:
    inputs:
      highs_ref:
        description: HiGHS ref
        default: latest
  # pre-release.yml calls this, and runs it weekly
  workflow_call:
    inputs:
      highs_ref:
        type: string
        default: latest
  push:
    branches: [main]
    paths: [packagers/**, .github/workflows/packagers.yml]
  pull_request:
    paths: [packagers/**, .github/workflows/packagers.yml]

concurrency:
  group: packagers-${{ github.ref }}-${{ github.event_name }}-${{ inputs.highs_ref }}
  cancel-in-progress: true

env:
  HIGHS_REF: ${{ inputs.highs_ref || 'latest' }}

defaults:
  run:
    shell: bash

jobs:
  vcpkg:
    name: vcpkg ${{ matrix.os }} ${{ matrix.feature }} ${{ matrix.triplet }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        feature: [core, extras] # extras = HiPO
        triplet: [""] # default triplet
        include:
          - { os: windows-latest, feature: core, triplet: x64-windows-static }
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ERGO-Code/HiGHS
          ref: ${{ env.HIGHS_REF }}
          path: highs

      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Apply the port's patches and point it at this HiGHS
        run: python packagers/use_highs_source.py vcpkg vcpkg/ports/highs highs

      - name: vcpkg install highs[${{ matrix.feature }}]
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./vcpkg/bootstrap-vcpkg.bat -disableMetrics; else ./vcpkg/bootstrap-vcpkg.sh -disableMetrics; fi
          ./vcpkg/vcpkg install "highs[${{ matrix.feature }}]${TRIPLET:+:$TRIPLET}" || {
            cat vcpkg/buildtrees/highs/*-err.log 2>/dev/null
            exit 1
          }

      - name: The installed highs executable solves afiro
        run: |
          for highs in vcpkg/installed/*/tools/highs/highs vcpkg/installed/*/tools/highs/highs.exe; do
            [ -f "$highs" ] && break
          done
          "$highs" highs/check/instances/afiro.mps | tee afiro.log
          grep -q "Model status *: *Optimal" afiro.log

      - name: Consumer with find_package(highs)
        env:
          # A static triplet links the static C runtime (/MT)
          STATIC_FLAGS: ${{ matrix.triplet && format('-DVCPKG_TARGET_TRIPLET={0} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded', matrix.triplet) || '' }}
        run: |
          cmake -S hipo-consumer -B consumer -DCMAKE_BUILD_TYPE=Release $STATIC_FLAGS \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer --config Release
          exe=consumer/consumer
          [ -x "$exe" ] || exe=consumer/Release/consumer.exe
          "$exe" highs/check/instances/afiro.mps ${{ matrix.feature == 'extras' && 'hipo' || 'ipm' }}

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: vcpkg-logs-${{ matrix.os }}-${{ matrix.feature }}-${{ matrix.triplet }}
          path: vcpkg/buildtrees/highs/*.log

  conda-forge:
    name: conda-forge ${{ matrix.feedstock }} ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feedstock: highs, platform: linux_64, os: ubuntu-latest, rattler: x86_64-unknown-linux-musl }
          - { feedstock: highspy, platform: linux_64, os: ubuntu-latest, rattler: x86_64-unknown-linux-musl }
          - { feedstock: highs, platform: osx_arm64, os: macos-latest, rattler: aarch64-apple-darwin }
          - { feedstock: highs, platform: win_64, os: windows-latest, rattler: x86_64-pc-windows-msvc.exe }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ERGO-Code/HiGHS
          ref: ${{ env.HIGHS_REF }}
          path: highs

      - uses: actions/checkout@v5
        with:
          repository: conda-forge/${{ matrix.feedstock }}-feedstock
          path: feedstock

      - name: Point the recipe at this HiGHS
        run: python packagers/use_highs_source.py conda feedstock/recipe/recipe.yaml "${{ github.workspace }}/highs"

      - name: rattler-build (builds and runs the recipe's tests)
        run: |
          rb=./rattler-build; [ "$RUNNER_OS" = Windows ] && rb=./rattler-build.exe
          curl -fsSL -o "$rb" https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-${{ matrix.rattler }}
          chmod +x "$rb"
          # One variant, as conda-forge CI uses: the newest CPython for highspy
          variant="$(ls feedstock/.ci_support/${{ matrix.platform }}_*.yaml | grep -v 't\.yaml$' | sort -V | tail -1)"
          echo "variant: $variant"
          # The variant sets channel_sources, so no -c: rattler-build rejects both
          "$rb" build --recipe feedstock/recipe -m "$variant" --output-dir conda-out

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ERGO-Code/HiGHS
          ref: ${{ env.HIGHS_REF }}
          path: highs

      - name: Point the formula at this HiGHS
        run: |
          git -C highs archive --format=tar.gz --prefix=highs/ -o "$RUNNER_TEMP/highs.tar.gz" HEAD
          curl -fsSL -o highs.rb https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/h/highs.rb
          python packagers/use_highs_source.py homebrew highs.rb "$RUNNER_TEMP/highs.tar.gz"
          brew tap-new --no-git local/highs-test
          cp highs.rb "$(brew --repository local/highs-test)/Formula/highs.rb"

      - name: brew install, brew test and brew linkage
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install --build-from-source --verbose local/highs-test/highs
          brew test --verbose local/highs-test/highs
          brew linkage --test local/highs-test/highs

  # conan-center's highs recipe, with the source swapped for this HiGHS. The
  # recipe downloads its source, so the tarball is served on localhost.
  conan:
    name: conan cppstd=${{ matrix.cppstd }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cppstd: [17, 20] # 20 failed in 1.15.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ERGO-Code/HiGHS
          ref: ${{ env.HIGHS_REF }}
          path: highs

      - uses: actions/checkout@v5
        with:
          repository: conan-io/conan-center-index
          path: cci
          sparse-checkout: recipes/highs

      - name: Point the recipe at this HiGHS
        run: |
          mkdir -p "$RUNNER_TEMP/srv"
          git -C highs archive --format=tar.gz --prefix=highs/ -o "$RUNNER_TEMP/srv/highs.tar.gz" HEAD
          version=$(awk -F= '/^HIGHS_(MAJOR|MINOR|PATCH)=/ {v = v (v ? "." : "") $2} END {print v}' highs/Version.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python packagers/use_highs_source.py conan cci/recipes/highs/all/conandata.yml \
            "$RUNNER_TEMP/srv/highs.tar.gz" "$version" http://localhost:8765/highs.tar.gz

      - name: conan create (builds and runs test_package)
        run: |
          python3 -m http.server 8765 --directory "$RUNNER_TEMP/srv" > /dev/null 2>&1 &
          until curl -fsI http://localhost:8765/highs.tar.gz > /dev/null; do sleep 1; done
          pipx install conan
          conan profile detect
          conan create cci/recipes/highs/all --version "$VERSION" \
            -s compiler.cppstd=${{ matrix.cppstd }} --build=missing

  # Same packages as HiGHS's nix-deps.yml, which only runs by hand on HiGHS itself
  nixpkgs:
    name: nixpkgs ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 360 # or-tools and casadi build from source against this HiGHS
    strategy:
      fail-fast: false
      matrix:
        package:
          - highs
          - python3Packages.highspy
          - python3Packages.qpsolvers
          - python3Packages.cvxpy
          - sleqp
          - casadi
          - or-tools
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ERGO-Code/HiGHS
          ref: ${{ env.HIGHS_REF }}
          path: highs

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: nix build ${{ matrix.package }} (runs its nixpkgs checks)
        run: >
          nix build --print-build-logs --no-link --impure
          -f packagers/nixpkgs.nix
          --argstr highsSrc "$PWD/highs"
          --argstr package "${{ matrix.package }}"
