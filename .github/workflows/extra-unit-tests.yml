name: extra-unit-tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      highs_ref:
        description: HiGHS ref
        default: latest
  # pre-release.yml calls this, and runs it weekly
  workflow_call:
    inputs:
      highs_ref:
        type: string
        default: latest

concurrency:
  group: extra-unit-tests-${{ github.ref }}-${{ github.event_name }}-${{ inputs.highs_ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Checkout HiGHS repo
        uses: actions/checkout@v5
        with:
          repository: ERGO-Code/HiGHS
          ref: ${{ inputs.highs_ref || 'latest' }}
          path: HiGHS

      - name: Checkout highs-unit-tests repo
        uses: actions/checkout@v5
        with:
          repository: galabovaa/highs-unit-tests
          ref: main
          path: highs-unit-tests

      - name: HiGHS dir 
        working-directory: HiGHS
        run: |
          ls -a
          pwd

      - name: extra tests dir
        working-directory: highs-unit-tests
        run: |
          ls -a
          pwd
        
      - name: workspace dir
        working-directory: ${{runner.workspace}} 
        run: |
          ls -a
          pwd

      - name: Symlink extra tests to HiGHS
        working-directory: ${{runner.workspace}}/highs-tests/HiGHS/check
        run: |
          ls -a
          pwd 
          mv ${{runner.workspace}}/highs-tests/highs-unit-tests ./highs-unit-tests
          cd highs-unit-tests
          ls -a
          pwd

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake ${{runner.workspace}}/highs-tests/HiGHS -DALL_TESTS=ON -DBUILD_EXTRA_UNIT_TESTS=ON

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          cmake --build . -j2 

      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --timeout 300 --output-on-failure 