name: cmake-fetch-linux

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      highs_refs:
        description: JSON list of HiGHS refs to test
        default: '["master", "latest"]'
  # pre-release.yml calls this, and runs it weekly
  workflow_call:
    inputs:
      highs_refs:
        type: string
        default: '["master", "latest"]'

concurrency:
  group: cmake-fetch-linux-${{ github.ref }}-${{ github.event_name }}-${{ inputs.highs_refs }}
  cancel-in-progress: true

jobs:
  fetch_ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        branch: ${{ fromJSON(inputs.highs_refs || '["master", "latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout CMakeHighsFetchContent
        uses: actions/checkout@v4
        with:
          repository: galabovaa/CMakeHighsFetchContent
          ref: main
          path: CMakeHighsFetchContent-main-${{matrix.branch}}

      - name: Create build dir
        run: |
          cmake -E make_directory ${{runner.workspace}}/build-fetch-${{matrix.branch}}

      - name: Build CMakeFindHighsPackage
        working-directory: ${{runner.workspace}}/build-fetch-${{matrix.branch}}
        shell: bash
        run: |
          cmake ${{runner.workspace}}/highs-tests/CMakeHighsFetchContent-main-${{matrix.branch}} \
            -DBRANCH=${{matrix.branch}} \
            -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-fetch-${{matrix.branch}}
          cmake --build . -j2 
          cmake --install .

      - name: Test 
        working-directory: ${{runner.workspace}}/build-fetch-${{matrix.branch}}
        shell: bash
        run: |
          ./main

      - name: Test install
        working-directory: ${{runner.workspace}}/install-fetch-${{matrix.branch}}
        shell: bash
        run: |
          ./bin/main