name: ortools-cmake

# OR-Tools (newest release tag) built with CMake against HiGHS (latest branch).
# Slow (1-3 h per OS) but uncached on purpose, so nothing stale is tested.
on:
  workflow_dispatch:
    inputs:
      ortools_ref:
        description: OR-Tools ref (empty = newest release tag)
        default: ""
      highs_ref:
        description: HiGHS ref
        default: latest
  schedule:
    - cron: "0 2 * * 1" # Mondays
  push:
    branches: [main]
    paths: [ortools/**, .github/workflows/ortools-cmake.yml]
  pull_request:
    paths: [ortools/**, .github/workflows/ortools-cmake.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: cmake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      ORTOOLS_REF: ${{ inputs.ortools_ref }}
      HIGHS_REF: ${{ inputs.highs_ref || 'latest' }}
      AFIRO_OBJECTIVE: "-464.7531428571"

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out OR-Tools and HiGHS
        run: bash ortools/prepare.sh ortools-work

      - name: Configure OR-Tools with this HiGHS
        run: >
          cmake -S "$ORTOOLS_DIR" -B ortools-work/build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DEPS=ON -DUSE_SCIP=OFF -DUSE_COINOR=OFF
          -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=ON
          -DFETCHCONTENT_SOURCE_DIR_HIGHS="$HIGHS_DIR"

      - name: Check OR-Tools picked up this HiGHS
        run: |
          used="$(sed -n 's/^HIGHS_SOURCE_DIR:STATIC=//p' ortools-work/build/CMakeCache.txt)"
          echo "HiGHS source used by OR-Tools: ${used:-<none>}"
          [ -n "$used" ] && [ "$used" -ef "$HIGHS_DIR" ]

      - name: Build
        run: cmake --build ortools-work/build --config Release --parallel 4

      - name: solve afiro with HiGHS
        run: |
          solve=ortools-work/build/bin/solve
          [ -x "$solve" ] || solve=ortools-work/build/Release/bin/solve.exe
          python ortools/check_log.py \
            --expect-objective "$AFIRO_OBJECTIVE" \
            --expect-highs-version "$HIGHS_VERSION" \
            -- "$solve" --solver=highs --input="$HIGHS_DIR/check/instances/afiro.mps"

      # OR-Tools disables this test in CTest on all systems ("fail on windows and
      # takes too long"), so ctest cannot run it. Same working folder as its add_test.
      # shortcut: Linux only, add Windows when OR-Tools says the test passes there
      - name: HiGHS solver test
        if: runner.os == 'Linux'
        working-directory: ${{ env.ORTOOLS_DIR }}
        timeout-minutes: 60
        run: '"$GITHUB_WORKSPACE/ortools-work/build/bin/math_opt_solvers_highs_solver_test"'
